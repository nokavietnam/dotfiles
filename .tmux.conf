
# .tmux.config 
# Install <Ctrl + b> + I
# Update <Ctrl + b> + U


set -g default-terminal 'screen-256color'
set -g status-style 'bg=#1e1e2e'

# Giảm ESC delay xuống 0 để thoát Insert mode trong Vim không bị trễ
set -s escape-time 0

# Bật focus events (cần thiết cho vim auto-read và các plugin lsp)
set -g focus-events on

set -g set-clipboard on

setw -g mode-keys vi 
bind-key h select-pane -L 
bind-key j select-pane -D 
bind-key k select-pane -U 
bind-key l select-pane -R

bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# theme
set -g @plugin 'dracula/tmux'
# set -g @dracula-plugins 'cpu-usage ram-usage'
# set -g @dracula-cpu-usage-colors 'pink dark-gray'
set -g @dracula-show-powerline true 
set -g @dracula-show-flags true 
set -g @dracula-show-left-icon session
set -g @dracula-cpu-display-load true
set -g @dracula-plugins "cpu-usage ram-usage network-bandwidth"
# per default available colors: white, gray, dark_gray, light_purple, dark_purple, cyan, green, orange, red, pink, yellow
# set -g @dracula-[plugin-name]-colors "[background] [foreground]"
set -g @dracula-cpu-usage-colors "pink dark_gray"
# set -g @dracula-cpu-arch-label "󰍛 "
set -g @dracula-cpu-usage-label " "
set -g @dracula-ram-usage-label " "
# set -g @dracula-tmux-ram-usage-label " "

# the default is 5, it can accept any number
set -g @dracula-refresh-rate 5
set -g @dracula-border-contrast true
set -g @dracula-transparent-powerline-bg true
# default is 1, it can accept any number and 0 disables padding.
set -g @dracula-left-icon-padding 0
set -g @dracula-show-battery-status true
set -g @dracula-time-format "%F %R"

# network 
set -g @dracula-network-bandwidth "en0"
set -g @dracula-network-bandwidth-show-interface true
set -g @dracula-network-bandwidth-interval 1

# set -g @dracula-network-hosts "1.1.1.1 8.8.8.8"
# set -g @dracula-network-ethernet-label "󰈀 Eth"
# set -g @dracula-network-offline-label "󱍢 "
# set -g @dracula-network-wifi-label " "

# set -g @dracula-ping-server "google.com"
# set -g @dracula-ping-rate 5

# set -g @dracula-network-colors "green dark-gray"
# set -g @dracula-network-colors "green dark_gray"
set -g @dracula-network-bandwidth-colors "green dark_gray"
# set -g @dracula-network-ping-colors "green dark_gray"

set -g status-position top


# neovim 
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

set -g @vim_navigator_prefix_mapping_clear_screen ""


set -g @plugin 'laktak/extrakto'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'AngryMorrocoy/tmux-neolazygit'

## config auto reopen session 
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# set -g @continuum-restore 'on'
# set -g @continuum-boot 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
